name: Apply TFM feedback

on:
  push:
    branches:
      - apply-tfm-feedback
    paths:
      - scripts/apply-tfm-feedback.mjs
      - .github/workflows/apply-tfm-feedback.yml

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, '[skip tfm-update]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: apply-tfm-feedback
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply confirmed feedback
        run: node scripts/apply-tfm-feedback.mjs

      - name: Validate production build
        run: npm run build

      - name: Commit generated update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/layout.tsx app/feedback-updates.css app/favicon.ico public/favicon.ico data/site-config.ts
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Apply TFM website feedback [skip tfm-update]"
          git push origin apply-tfm-feedback

# Triggered after the workflow became available on the branch.
